[package]
name = "reth-bsc-evm"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"

[dependencies]
alloy-consensus = "2.5.0"
alloy-primitives = "1.6.1"
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "f93318f120f6300599b21170d6c7bef81ed63d87", default-features = false, features = ["std", "secp256k1"] }

alloy-rpc-types-eth = "2.5.0"
reth-evm = { git = "https://github.com/bnb-chain/reth.git", rev = "664f9c1685d2376f030a62adb83ee0a463a29eff" }

revm-primitives = "43.0.0"
reth-chainspec = { git = "https://github.com/bnb-chain/reth.git", rev = "664f9c1685d2376f030a62adb83ee0a463a29eff" }
reth-ethereum-forks = { git = "https://github.com/bnb-chain/reth.git", rev = "664f9c1685d2376f030a62adb83ee0a463a29eff", features = ["serde"] }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
alloy-eips = "2.5.0"
alloy-trie = "0.9.8"
reth-execution-types = { git = "https://github.com/bnb-chain/reth.git", rev = "664f9c1685d2376f030a62adb83ee0a463a29eff" }
reth-trie-common = { git = "https://github.com/bnb-chain/reth.git", rev = "664f9c1685d2376f030a62adb83ee0a463a29eff" }

[features]
serde = ["dep:serde"]
