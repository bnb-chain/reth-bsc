[package]
name = "reth-bsc-evm"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"

[dependencies]
alloy-consensus = "2.5.0"
alloy-primitives = "1.6.1"
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "66687c18b34d3bdbb899f5eb7605070615c03475", default-features = false, features = ["std", "secp256k1"] }

alloy-rpc-types-eth = "2.5.0"
reth-evm = { git = "https://github.com/bnb-chain/reth.git", rev = "d0080ff8a8d2262d96ed67aef3d9c0aeedbc8156" }

revm-primitives = "43.0.0"
reth-chainspec = { git = "https://github.com/bnb-chain/reth.git", rev = "d0080ff8a8d2262d96ed67aef3d9c0aeedbc8156" }
reth-ethereum-forks = { git = "https://github.com/bnb-chain/reth.git", rev = "d0080ff8a8d2262d96ed67aef3d9c0aeedbc8156", features = ["serde"] }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
alloy-eips = "2.5.0"
alloy-trie = "0.9.8"
reth-execution-types = { git = "https://github.com/bnb-chain/reth.git", rev = "d0080ff8a8d2262d96ed67aef3d9c0aeedbc8156" }
reth-trie-common = { git = "https://github.com/bnb-chain/reth.git", rev = "d0080ff8a8d2262d96ed67aef3d9c0aeedbc8156" }

[features]
serde = ["dep:serde"]
