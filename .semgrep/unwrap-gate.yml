rules:
  - id: high-risk-unwrap
    languages: [rust]
    message: >
      A new unwrap() or expect() call was added in a high-risk module.
      Please reply directly to this comment explaining "why unwrap cannot panic here";
      once the code owner confirms, the conversation can be resolved
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: $X.unwrap()
          - pattern: $X.expect(...)
    paths:
      include:
        - "/src/consensus/parlia/**"
        - "/src/evm/**"
        - "/src/node/network/block_import/**"
        - "/src/node/vote_*.rs"
