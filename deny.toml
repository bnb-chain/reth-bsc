[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
# 宽松许可证，直接放行；MPL-2.0/MPL-2.0+ 不在列表里，会被标记出来提醒人工评估
# （bitmaps、contracts、fastrlp、imbl、imbl-sized-chunks 这 5 个包）
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
# 忽略仓库自己的包（reth_bsc、bsc-ef-tests），它们没有 license 字段是正常的，不是外部依赖问题
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
