[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
# Permissive licenses are allowed outright; MPL-2.0/MPL-2.0+ is not in the list, so it
# gets flagged for manual review (affects 5 crates: bitmaps, contracts, fastrlp, imbl, imbl-sized-chunks)
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
# Ignore this repo's own crates (reth_bsc, bsc-ef-tests); it's normal for them to lack a license field,
# not an external-dependency issue
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
