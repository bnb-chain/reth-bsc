tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1"
bit-set = "0.5.3"
rand = "0.9"
humantime = { version = "2", default-features = false }
zeroize = "1"
# For EIP-2335 BLS keystore support
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
sha2 = "0.10"
pbkdf2 = "0.12"
scrypt = "0.11"

# precompiles deps
bls_on_arkworks = "0.3.0"
blst = "0.3.15"
curve25519-dalek = "4"

cometbft = { git = "https://github.com/bnb-chain/greenfield-cometbft-rs.git", rev = "1282547" }
cometbft-light-client-verifier = { git = "https://github.com/bnb-chain/greenfield-cometbft-rs.git", rev = "1282547" }
cometbft-proto = { git = "https://github.com/bnb-chain/greenfield-cometbft-rs.git", rev = "1282547" }
cometbft-light-client = { git = "https://github.com/bnb-chain/greenfield-cometbft-rs.git", rev = "1282547" }

# cometbft-proto is still generated with prost 0.12; the MEV gRPC API uses the
# prost version paired with tonic 0.14.
prost12 = { package = "prost", version = "0.12.6" }
prost = { version = "0.14.3" }

tendermint = { git = "https://github.com/bnb-chain/tendermint-rs-parlia", rev = "3f7b54d9fb93a0432bdadfc733cdcb8a887a851e", features = [
    "secp256k1",
] }
signature = "2.2.0"
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
eth-keystore = "0.5"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14.6"

[target.'cfg(unix)'.dependencies]
tikv-jemalloc-ctl = "0.6"
tikv-jemallocator = { version = "0.6", optional = true }
libc = "0.2"

# gmp-mpfr-sys (pulled by revm-precompile) refuses to build when the host and
# target triples differ, which is the case for the static musl cross-build used
# to run on old-glibc hosts (see https://app.clickup.com/25652588/docs/revbc-65897/revbc-365597). `force-cross` allows it. This
# is scoped to the musl target so normal/CI (glibc) builds are unaffected.
[target.x86_64-unknown-linux-musl.dependencies]
gmp-mpfr-sys = { version = "1.7", features = ["force-cross"] }

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator", "reth/jemalloc"]
dev = ["reth-cli-commands/arbitrary", "reth/dev", "revm/dev"]
asm-keccak = [
    "reth/asm-keccak",
    "reth-node-core/asm-keccak",
    "reth-node-ethereum/asm-keccak",
]

serde = [
    "alloy-chains/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "alloy-rpc-types-engine/serde",
    "alloy-rpc-types-eth/serde",
    "bytes/serde",
    "parking_lot/serde",
    "reth-eth-wire/serde",
    "reth-eth-wire-types/serde",
    "reth-ethereum-forks/serde",
    "reth-ethereum-primitives/serde",
    "reth-network/serde",
    "reth-network-api/serde",
    "reth-primitives-traits/serde",
    "reth-revm/serde",
    "reth-trie-common/serde",
    "reth-trie-db/serde",
    "revm/serde",
    "secp256k1/serde",
]

client = [
    "jsonrpsee/client",
    "jsonrpsee/async-client",
    "reth-rpc-eth-api/client",
]

bench-test = []

# Use the `--profile profiling` flag to show symbols in release mode.
# e.g. `cargo build --profile profiling`
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
# Keep line-tables so flamegraph frames carry Rust function names. Without this
# the maxperf binary is stripped (inherited from [profile.release]) and every
# reth-bsc frame collapses to a single `[reth-bsc]` bar in the SVG.
debug = "line-tables-only"
strip = false
split-debuginfo = "off"

# Apply the same to every transitive dependency so revm/rayon frames also
# resolve. Without this, only reth-bsc's own symbols show up and the whole
# state-root path still looks opaque.
[profile.maxperf.package."*"]
debug = "line-tables-only"
strip = false

[dev-dependencies]
reth-db-common = { workspace = true }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
reth-rpc = { workspace = true }
criterion = "0.5"
uuid = { version = "1", features = ["v4"] }
reth-transaction-pool = { workspace = true, features = ["test-utils"] }
# `test-util` gives tests a paused clock (`start_paused`, `time::advance`), so timing invariants
# can be asserted by ordering instead of racing a wall clock.
tokio = { version = "1.44", features = ["full", "test-util"] }

[[bench]]
name = "cas20"
harness = false
required-features = ["bench-test"]

# Preserve BSC header conversion and sealed-header replacement with reth-core 0.8.2.
