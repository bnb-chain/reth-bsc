[workspace]
members = [".", "testing/bsc-ef-tests"]

[package]
name = "reth_bsc"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "reth_bsc"
path = "src/lib.rs"

[[bin]]
name = "reth-bsc"
path = "src/main.rs"

[dependencies]
reth = { path = "/Users/chee/Documents/repo/reth/bin/reth" }
reth-cli = { path = "/Users/chee/Documents/repo/reth/crates/cli/cli" }
reth-cli-commands = { path = "/Users/chee/Documents/repo/reth/crates/cli/commands" }
reth-basic-payload-builder = { path = "/Users/chee/Documents/repo/reth/crates/payload/basic" }
reth-db = { path = "/Users/chee/Documents/repo/reth/crates/storage/db" }
reth-engine-local = { path = "/Users/chee/Documents/repo/reth/crates/engine/local" }
reth-engine-tree = { path = "/Users/chee/Documents/repo/reth/crates/engine/tree" }
reth-node-builder = { path = "/Users/chee/Documents/repo/reth/crates/node/builder" }
reth-chainspec = { path = "/Users/chee/Documents/repo/reth/crates/chainspec" }
reth-cli-util = { path = "/Users/chee/Documents/repo/reth/crates/cli/util" }
reth-discv4 = { path = "/Users/chee/Documents/repo/reth/crates/net/discv4", features = ["test-utils"] }
reth-engine-primitives = { path = "/Users/chee/Documents/repo/reth/crates/engine/primitives" }
reth-ethereum-forks = { path = "/Users/chee/Documents/repo/reth/crates/ethereum/hardforks", features = ["serde"] }
reth-ethereum-payload-builder = { path = "/Users/chee/Documents/repo/reth/crates/ethereum/payload" }
reth-payload-builder-primitives = { path = "/Users/chee/Documents/repo/reth/crates/payload/builder-primitives" }
reth-chain-state = { path = "/Users/chee/Documents/repo/reth/crates/chain-state" }
reth-ethereum-primitives = { path = "/Users/chee/Documents/repo/reth/crates/ethereum/primitives" }
reth-eth-wire = { path = "/Users/chee/Documents/repo/reth/crates/net/eth-wire" }
reth-eth-wire-types = { path = "/Users/chee/Documents/repo/reth/crates/net/eth-wire-types" }
reth-evm = { path = "/Users/chee/Documents/repo/reth/crates/evm/evm" }
reth-evm-ethereum = { path = "/Users/chee/Documents/repo/reth/crates/ethereum/evm" }
reth-execution-types = { path = "/Users/chee/Documents/repo/reth/crates/evm/execution-types" }
reth-ipc = { path = "/Users/chee/Documents/repo/reth/crates/rpc/ipc" }
reth-metrics = { path = "/Users/chee/Documents/repo/reth/crates/metrics" }
reth-node-core = { path = "/Users/chee/Documents/repo/reth/crates/node/core" }
reth-revm = { path = "/Users/chee/Documents/repo/reth/crates/revm" }
reth-network = { path = "/Users/chee/Documents/repo/reth/crates/net/network", features = ["test-utils"] }
reth-network-p2p = { path = "/Users/chee/Documents/repo/reth/crates/net/p2p" }
reth-network-api = { path = "/Users/chee/Documents/repo/reth/crates/net/network-api" }
reth-node-ethereum = { path = "/Users/chee/Documents/repo/reth/crates/ethereum/node", features = ["test-utils"] }
reth-network-peers = { path = "/Users/chee/Documents/repo/reth/crates/net/peers" }
reth-payload-primitives = { path = "/Users/chee/Documents/repo/reth/crates/payload/primitives" }
reth-ethereum-engine-primitives = { path = "/Users/chee/Documents/repo/reth/crates/ethereum/engine-primitives" }
reth-primitives-traits = { version = "0.5.0", default-features = false }
reth-codecs = { version = "0.5.0" }
reth-provider = { path = "/Users/chee/Documents/repo/reth/crates/storage/provider", features = ["test-utils"] }
reth-rpc-eth-api = { path = "/Users/chee/Documents/repo/reth/crates/rpc/rpc-eth-api" }
reth-rpc-convert = { path = "/Users/chee/Documents/repo/reth/crates/rpc/rpc-convert" }
reth-rpc-engine-api = { path = "/Users/chee/Documents/repo/reth/crates/rpc/rpc-engine-api" }
reth-rpc-server-types = { path = "/Users/chee/Documents/repo/reth/crates/rpc/rpc-server-types" }
reth-trie-common = { path = "/Users/chee/Documents/repo/reth/crates/trie/common" }
reth-trie-db = { path = "/Users/chee/Documents/repo/reth/crates/trie/db" }
reth-tasks = { path = "/Users/chee/Documents/repo/reth/crates/tasks" }
reth-transaction-pool = { path = "/Users/chee/Documents/repo/reth/crates/transaction-pool" }

revm = "38.0.0"
revm-database = "13.0.0"
revm-bytecode = "10.0.0"
revm-state = "11.0.0"
revm-primitives = { version = "23.0.0", default-features = false }
revm-interpreter = "35.0.0"
revm-database-interface = "11.0.0"

# alloy dependencies
alloy-evm = { version = "0.34.0", features = ["rpc"] }

alloy-genesis = "2.0.4"
alloy-consensus = "2.0.4"
alloy-eips = "2.0.4"
alloy-network = "2.0.4"
alloy-rpc-types = { version = "2.0.4", features = ["eth"] }
alloy-rpc-types-eth = "2.0.4"
alloy-rpc-types-engine = "2.0.4"
alloy-rpc-types-mev = "2.0.4"
alloy-signer = "2.0.4"

alloy-chains = "0.2.33"
alloy-rlp = { version = "0.3.13", default-features = false, features = [
    "core-net",
] }

alloy-dyn-abi = "1.5.6"
alloy-json-abi = { version = "1.5.6", default-features = false }
alloy-primitives = { version = "1.5.6", default-features = false, features = [
    "map-foldhash",
] }
alloy-sol-macro = "1.5.6"
alloy-sol-types = { version = "1.5.6", default-features = false }

jsonrpsee = { version = "0.26.0", features = ["server", "client", "macros"] }
jsonrpsee-core = { version = "0.26.0", features = ["server"] }
jsonrpsee-types = "0.26.0"

# misc dependencies
auto_impl = "1"
async-trait = "0.1"
bytes = "1.5"
clap = { version = "4.4", features = ["derive"] }
cfg-if = { version = "1.0", default-features = false }
derive_more = "0.99"
eyre = "0.6"
futures = "0.3"
either = "1"
hex = "0.4"
lazy_static = "1.4.0"
lru = "0.12"
metrics = "0.24"
phf = { version = "0.11", features = ["macros"] }
once_cell = { version = "1.19", default-features = false, features = ["alloc"] }
parity-bytes = { version = "0.1.2", default-features = false }
parking_lot = "0.12"
secp256k1 = { version = "0.30", features = [
    "global-context",
    "std",
    "recovery",
] }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = "1.0"
serde_cbor = "0.11"
schnellru = "0.2"
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
bit-set = "0.5.3"
rand = "0.9"
zeroize = "1"
# For EIP-2335 BLS keystore support
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
sha2 = "0.10"
pbkdf2 = "0.12"
scrypt = "0.11"

# precompiles deps
bls_on_arkworks = "0.3.0"
blst = "0.3.15"

cometbft = { git = "https://github.com/bnb-chain/greenfield-cometbft-rs.git", rev = "1282547" }
cometbft-light-client-verifier = { git = "https://github.com/bnb-chain/greenfield-cometbft-rs.git", rev = "1282547" }
cometbft-proto = { git = "https://github.com/bnb-chain/greenfield-cometbft-rs.git", rev = "1282547" }
cometbft-light-client = { git = "https://github.com/bnb-chain/greenfield-cometbft-rs.git", rev = "1282547" }

prost = { version = "0.12.6" }

tendermint = { git = "https://github.com/bnb-chain/tendermint-rs-parlia", rev = "8c21ccbd58a174e07eed2c9343e63ccd00f0fbd5", features = [
    "secp256k1",
] }
signature = "2.2.0"
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
eth-keystore = "0.5"

[target.'cfg(unix)'.dependencies]
tikv-jemalloc-ctl = "0.6"
tikv-jemallocator = { version = "0.6", optional = true }
libc = "0.2"

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator", "reth/jemalloc"]
dev = ["reth-cli-commands/arbitrary", "reth/dev", "revm/dev"]
asm-keccak = [
    "reth/asm-keccak",
    "reth-node-core/asm-keccak",
    "reth-node-ethereum/asm-keccak",
]

serde = [
    "alloy-chains/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "alloy-rpc-types-engine/serde",
    "alloy-rpc-types-eth/serde",
    "bytes/serde",
    "parking_lot/serde",
    "reth-eth-wire/serde",
    "reth-eth-wire-types/serde",
    "reth-ethereum-forks/serde",
    "reth-ethereum-primitives/serde",
    "reth-network/serde",
    "reth-network-api/serde",
    "reth-primitives-traits/serde",
    "reth-revm/serde",
    "reth-trie-common/serde",
    "reth-trie-db/serde",
    "revm/serde",
    "secp256k1/serde",
]

client = [
    "jsonrpsee/client",
    "jsonrpsee/async-client",
    "reth-rpc-eth-api/client",
]

bench-test = []

# Use the `--profile profiling` flag to show symbols in release mode.
# e.g. `cargo build --profile profiling`
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
# Keep line-tables so flamegraph frames carry Rust function names. Without this
# the maxperf binary is stripped (inherited from [profile.release]) and every
# reth-bsc frame collapses to a single `[reth-bsc]` bar in the SVG.
debug = "line-tables-only"
strip = false
split-debuginfo = "off"

# Apply the same to every transitive dependency so revm/rayon frames also
# resolve. Without this, only reth-bsc's own symbols show up and the whole
# state-root path still looks opaque.
[profile.maxperf.package."*"]
debug = "line-tables-only"
strip = false

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
