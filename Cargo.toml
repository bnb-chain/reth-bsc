revm-database = "43.0.0"
revm-bytecode = "43.0.0"
revm-state = "43.0.0"
revm-primitives = { version = "43.0.0", default-features = false }
revm-interpreter = "43.0.0"
revm-inspectors = "0.44.3"
revm-database-interface = "43.0.0"

# alloy dependencies
alloy-evm = { version = "0.39.0", features = ["rpc", "overrides"] }

alloy-genesis = "2.5.0"
alloy-consensus = "2.5.0"
alloy-eips = "2.5.0"
alloy-network = "2.5.0"
alloy-rpc-types = { version = "2.5.0", features = ["eth", "trace"] }
alloy-rpc-types-eth = "2.5.0"
alloy-rpc-types-engine = "2.5.0"
alloy-rpc-types-mev = "2.5.0"
alloy-signer = "2.5.0"

alloy-chains = "0.2.34"
alloy-rlp = { version = "0.3.16", default-features = false, features = [
    "core-net",
] }

alloy-dyn-abi = "1.6.1"
