[package]
name = "bsc-ef-tests"
version = "0.1.0"
edition = "2021"
description = "Execution Spec Tests for BSC EVM"

[features]
ef-tests = []
jemalloc = ["dep:tikv-jemallocator"]
asm-keccak = ["alloy-primitives/asm-keccak"]

[dependencies]
# BSC crate
reth_bsc = { path = "../.." }
# Used only by the test harness, to generate its validator key instead of embedding one.
rand = "0.9"

# reth dependencies aligned with root crate branch to avoid duplicate crate versions
reth-chainspec = { path = "/Users/chee/Documents/repo/reth/crates/chainspec" }
reth-consensus = { path = "/Users/chee/Documents/repo/reth/crates/consensus/consensus" }
reth-ethereum-forks = { path = "/Users/chee/Documents/repo/reth/crates/ethereum/hardforks" }
reth-db = { path = "/Users/chee/Documents/repo/reth/crates/storage/db", features = [    "mdbx",
    "test-utils",
    "disable-lock",
] }
reth-db-api = { path = "/Users/chee/Documents/repo/reth/crates/storage/db-api" }
reth-db-common = { path = "/Users/chee/Documents/repo/reth/crates/storage/db-common" }
reth-ethereum-consensus = { path = "/Users/chee/Documents/repo/reth/crates/ethereum/consensus" }
reth-ethereum-primitives = { path = "/Users/chee/Documents/repo/reth/crates/ethereum/primitives" }
reth-evm = { path = "/Users/chee/Documents/repo/reth/crates/evm/evm" }
reth-evm-ethereum = { path = "/Users/chee/Documents/repo/reth/crates/ethereum/evm" }
reth-primitives-traits = { version = "0.6.0", default-features = false }
reth-provider = { path = "/Users/chee/Documents/repo/reth/crates/storage/provider", features = [
    "test-utils",
] }
reth-revm = { path = "/Users/chee/Documents/repo/reth/crates/revm", features = [
    "std",
] }
reth-tracing = { path = "/Users/chee/Documents/repo/reth/crates/tracing" }
reth-trie = { path = "/Users/chee/Documents/repo/reth/crates/trie/trie" }
reth-trie-db = { path = "/Users/chee/Documents/repo/reth/crates/trie/db" }
# revm

# alloy
alloy-consensus = "2.0.0"
alloy-eips = "2.0.0"
alloy-genesis = "2.0.0"
alloy-primitives = "1.5.6"
alloy-rlp = "0.3.13"

# misc
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tikv-jemallocator = { version = "0.6", optional = true }
walkdir = "2"
