[package]
name = "bsc-ef-tests"
version = "0.1.0"
edition = "2021"
description = "Execution Spec Tests for BSC EVM"

[features]
ef-tests = []
jemalloc = ["dep:tikv-jemallocator"]
asm-keccak = ["alloy-primitives/asm-keccak"]

[dependencies]
# BSC crate
reth_bsc = { path = "../.." }
# Used only by the test harness, to generate its validator key instead of embedding one.
rand = "0.9"

# reth dependencies aligned with root crate branch to avoid duplicate crate versions
reth-chainspec = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d" }
reth-consensus = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d" }
reth-ethereum-forks = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d" }
reth-db = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d", features = [    "mdbx",
    "test-utils",
    "disable-lock",
] }
reth-db-api = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d" }
reth-db-common = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d" }
reth-ethereum-consensus = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d" }
reth-ethereum-primitives = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d" }
reth-evm = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d" }
reth-evm-ethereum = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d" }
reth-primitives-traits = { version = "0.8.2", default-features = false }
reth-provider = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d", features = [
    "test-utils",
] }
revm = "43.0.3"
reth-tracing = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d" }
reth-trie = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d" }
reth-trie-db = { git = "https://github.com/bnb-chain/reth.git", rev = "a00d2383bf461effb0edc7ef4759981688ee4c5d" }
# revm

# alloy
alloy-consensus = "2.5.0"
alloy-eips = "2.5.0"
alloy-genesis = "2.5.0"
alloy-primitives = "1.5.6"
alloy-rlp = "0.3.13"

# misc
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tikv-jemallocator = { version = "0.6", optional = true }
walkdir = "2"
