[package]
name = "bsc-ef-tests"
version = "0.1.0"
edition = "2021"
description = "Execution Spec Tests for BSC EVM"

[features]
ef-tests = []
jemalloc = ["dep:tikv-jemallocator"]
asm-keccak = ["alloy-primitives/asm-keccak"]

[dependencies]
# BSC crate
reth_bsc = { path = "../.." }

# reth dependencies aligned with root crate branch to avoid duplicate crate versions
reth-chainspec = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784" }
reth-consensus = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784" }
reth-ethereum-forks = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784" }
reth-db = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784", features = [
    "mdbx",
    "test-utils",
    "disable-lock",
] }
reth-db-api = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784" }
reth-db-common = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784" }
reth-ethereum-consensus = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784" }
reth-ethereum-primitives = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784" }
reth-evm = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784" }
reth-evm-ethereum = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784" }
reth-primitives-traits = { git = "https://github.com/bnb-chain/reth-core.git", branch = "v0.3.1-v2", default-features = false }
reth-provider = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784", features = [
    "test-utils",
] }
reth-revm = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784", features = [
    "std",
] }
reth-tracing = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784" }
# Trie removal (TRIEDB_REMOVAL_PLAN.md): reth-trie / reth-trie-db are gone; only
# reth-trie-common remains for HashedPostState/KeccakKeyHasher (hashed state, no trie).
reth-trie-common = { git = "https://github.com/bnb-chain/reth.git", rev = "da4cb22adf904ae22c33ca8851ea8e4b39710784" }

# revm
revm = { version = "38.0.0", features = [
    "secp256k1",
    "blst",
    "c-kzg",
    "memory_limit",
] }

# alloy
alloy-consensus = "2.0.0"
alloy-eips = "2.0.0"
alloy-genesis = "2.0.0"
alloy-primitives = "1.5.6"
alloy-rlp = "0.3.13"

# misc
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tikv-jemallocator = { version = "0.6", optional = true }
walkdir = "2"
