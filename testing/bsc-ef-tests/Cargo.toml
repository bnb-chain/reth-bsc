[package]
name = "bsc-ef-tests"
version = "0.1.0"
edition = "2021"
description = "Execution Spec Tests for BSC EVM"

[features]
ef-tests = []
jemalloc = ["dep:tikv-jemallocator"]
asm-keccak = ["alloy-primitives/asm-keccak"]

[dependencies]
# BSC crate
reth_bsc = { path = "../.." }
# Used only by the test harness, to generate its validator key instead of embedding one.
rand = "0.9"

# Inherit Reth sources from the workspace; only test-specific features are set here.
reth-chainspec = { workspace = true }
reth-consensus = { workspace = true }
reth-ethereum-forks = { workspace = true }
reth-db = { workspace = true, features = [
    "mdbx",
    "test-utils",
    "disable-lock",
] }
reth-db-api = { workspace = true }
reth-db-common = { workspace = true }
reth-ethereum-consensus = { workspace = true }
reth-ethereum-primitives = { workspace = true }
reth-evm = { workspace = true }
reth-evm-ethereum = { workspace = true }
reth-primitives-traits = { workspace = true }
reth-provider = { workspace = true, features = [
    "test-utils",
] }
reth-revm = { workspace = true, features = [
    "std",
] }
reth-tracing = { workspace = true }
reth-trie = { workspace = true }
reth-trie-db = { workspace = true }

# revm
revm = { version = "38.0.0", features = [
    "secp256k1",
    "blst",
    "c-kzg",
    "memory_limit",
] }

# alloy
alloy-consensus = "2.0.0"
alloy-eips = "2.0.0"
alloy-genesis = "2.0.0"
alloy-primitives = "1.5.6"
alloy-rlp = "0.3.13"

# misc
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tikv-jemallocator = { version = "0.6", optional = true }
walkdir = "2"
